<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JASA SOSMED</title>

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="JASA SOSMED">
    <meta name="apple-mobile-web-app-title" content="JASA SOSMED">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="description" content="Jasa Sosmed TikTok - Followers, Likes, Views">

    <!-- Apple Touch Icon (iOS) -->
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png">

    <!-- Manifest akan di-inject via JS agar semua dalam 1 file -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        *:focus { outline: none; }
        *:focus-visible { outline: none; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #eef2f7;
            color: #2c3a52;
            padding-bottom: 96px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 0 #e8edf5;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3a8a, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .notif-icon {
            background: #f0f3f9;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.3rem;
            color: #1e293b;
            position: relative;
        }

        /* Notifikasi toast */
        .notification-toast {
            position: fixed;
            top: 76px;
            right: 16px;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 8px 28px rgba(30,58,138,0.12);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 250;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-left: 3px solid #6c9cd8;
            max-width: 260px;
        }
        .notification-toast i { color: #6c9cd8; font-size: 1rem; }
        .notification-toast .notif-text { font-size: 0.82rem; font-weight: 600; color: #2c3a52; line-height: 1.4; }
        .notification-toast .notif-text small { font-weight: 500; color: #a0b0c8; font-size: 0.72rem; }
        .notification-toast.show { transform: translateX(0); }

        /* Install PWA Banner */
        .pwa-install-banner {
            display: none;
            margin: 12px 16px;
            background: linear-gradient(135deg, #1e3a8a, #3b6bbf);
            border-radius: 18px;
            padding: 14px 16px;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 20px rgba(30,58,138,0.2);
            animation: slideDown 0.4s cubic-bezier(0.34, 1.3, 0.64, 1);
        }
        .pwa-install-banner.visible { display: flex; }
        .pwa-install-banner img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .pwa-install-info { flex: 1; }
        .pwa-install-info strong {
            display: block;
            color: white;
            font-size: 0.88rem;
            font-weight: 700;
        }
        .pwa-install-info span {
            color: rgba(255,255,255,0.75);
            font-size: 0.75rem;
        }
        .pwa-install-btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: 0.18s;
        }
        .pwa-install-btn:hover { background: #eef3ff; }
        .pwa-install-close {
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
            padding: 4px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Poster - tinggi menyesuaikan gambar, sudut sedikit bulat */
        .poster-area {
            margin: 20px 16px 24px 16px;
            border-radius: 12px;
            overflow: hidden;
            line-height: 0;
        }
        .poster-area img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .filter-scroll {
            margin: 0 16px 24px 16px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .filter-scroll::-webkit-scrollbar {
            display: none;
        }
        .filter-row { display: flex; gap: 10px; }
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #dde6f0;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.83rem;
            cursor: pointer;
            color: #5a7299;
            transition: 0.18s;
        }
        .filter-chip.active {
            background: #2c4a8a;
            border-color: #2c4a8a;
            color: white;
        }
        .filter-chip:hover:not(.active) { border-color: #b0c4df; background: #f5f8ff; }

        .products-grid {
            margin: 0 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 14px 12px;
            cursor: pointer;
            transition: 0.22s ease;
            border: 1px solid #e8eef6;
            box-shadow: 0 2px 12px rgba(30,58,138,0.04);
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30,58,138,0.08);
            border-color: #c8d8ef;
        }
        .product-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e2d45;
            margin-bottom: 4px;
        }
        .product-service-type {
            font-weight: 600;
            font-size: 0.62rem;
            text-transform: uppercase;
            color: #7a8fa8;
            margin-bottom: 10px;
            letter-spacing: 0.03em;
        }
        .product-icon-large {
            background: linear-gradient(135deg, #eef3ff, #e8f0fe);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 1.25rem;
            color: #4a7cc9;
            margin-bottom: 12px;
        }
        .price-line {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin: 6px 0;
        }
        .price-nominal {
            font-weight: 800;
            font-size: 1.05rem;
            color: #2c4a8a;
        }
        .price-per-unit {
            font-size: 0.68rem;
            font-weight: 600;
            color: #7a8fa8;
            background: #f0f4fb;
            padding: 2px 8px;
            border-radius: 40px;
        }
        .divider-line {
            margin: 10px 0 8px;
            height: 1px;
            background: #f0f4f9;
        }
        .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rating-label {
            font-weight: 600;
            font-size: 0.62rem;
            color: #8a9ab8;
        }
        .star-icon { color: #f0b429; font-size: 0.72rem; }
        .rating-number {
            font-weight: 700;
            font-size: 0.72rem;
            background: #f0f4fb;
            padding: 2px 8px;
            border-radius: 40px;
            color: #5a7299;
        }

        /* Floating cart */
        .cart-float {
            position: fixed;
            bottom: 24px;
            right: 16px;
            background: linear-gradient(135deg, #2c4a8a, #3b6bbf);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(44,74,138,0.3);
            transition: 0.2s;
        }
        .cart-float:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(44,74,138,0.38); }
        .cart-float i { font-size: 1.4rem; color: white; }
        .cart-badge {
            position: absolute;
            top: -6px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-weight: 800;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 30px;
            min-width: 22px;
            text-align: center;
        }

        /* MODAL dengan input link */
        .modal-confirm {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            align-items: center;
            justify-content: center;
            z-index: 300;
        }
        .modal-card {
            background: rgba(255,255,255,0.97);
            width: 90%;
            max-width: 380px;
            border-radius: 28px;
            overflow: hidden;
            animation: fadeIn 0.25s cubic-bezier(0.34, 1.3, 0.64, 1);
            box-shadow: 0 24px 60px rgba(15,23,42,0.12), 0 8px 20px rgba(15,23,42,0.06);
        }
        .modal-header {
            padding: 22px 20px 0 20px;
        }
        .modal-header h3 {
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            color: #0f172a;
        }

        /* Quantity Chips */
        .qty-chips-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 14px 20px 0 20px;
        }
        .qty-chip {
            flex: 1;
            min-width: 56px;
            text-align: center;
            padding: 9px 10px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            font-weight: 700;
            font-size: 0.85rem;
            color: #334155;
            cursor: pointer;
            transition: all 0.18s;
        }
        .qty-chip.selected {
            background: #1e3a8a;
            border-color: #1e3a8a;
            color: white;
        }
        .qty-chip:hover:not(.selected) {
            border-color: #94aad4;
            background: #eef3ff;
        }

        /* Input jumlah custom */
        .qty-input-section {
            margin: 12px 20px 0 20px;
        }
        .qty-input-section label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #64748b;
            display: block;
            margin-bottom: 5px;
        }
        .qty-input-section input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: 0.18s;
            color: #1e293b;
            background: #f8fafc;
        }
        .qty-input-section input:focus {
            border-color: #1e3a8a;
            background: white;
            box-shadow: 0 0 0 3px rgba(30,58,138,0.08);
        }

        /* Total harga real-time */
        .total-price-bar {
            margin: 12px 20px;
            background: linear-gradient(135deg, #eef3ff 0%, #f0f7ff 100%);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-price-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
        }
        .total-price-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1e3a8a;
        }
        .input-link-section {
            margin: 0 20px 12px 20px;
        }
        .input-link-section label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #64748b;
            display: block;
            margin-bottom: 5px;
        }
        .input-link-section input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.82rem;
            font-family: monospace;
            outline: none;
            transition: 0.18s;
            background: #f8fafc;
            color: #1e293b;
        }
        .input-link-section input:focus {
            border-color: #1e3a8a;
            background: white;
            box-shadow: 0 0 0 3px rgba(30,58,138,0.08);
        }
        .error-message {
            font-size: 0.7rem;
            color: #ef4444;
            margin-top: 6px;
            display: none;
        }
        .datetime-info {
            font-size: 0.68rem;
            color: #94a3b8;
            text-align: center;
            margin: 6px 20px 10px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            padding: 0 20px 22px 20px;
        }
        .btn-confirm, .btn-cancel {
            flex: 1;
            padding: 13px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.18s;
        }
        .btn-confirm { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; box-shadow: 0 6px 18px rgba(30,58,138,0.25); }
        .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(30,58,138,0.32); }
        .btn-cancel { background: #f1f5f9; color: #64748b; }
        .btn-cancel:hover { background: #e8eef6; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Keranjang */
        .cart-fullpage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #eef2f7;
            z-index: 400;
            overflow-y: auto;
            padding: 0 0 100px 0;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 18px 16px 18px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #e8edf5;
        }
        .cart-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e2d45;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cart-header h2 i {
            font-size: 1.1rem;
            color: #4a7cc9;
        }
        .close-cart-icon {
            background: #f0f4fb;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            color: #7a8fa8;
            transition: 0.18s;
        }
        .close-cart-icon:hover { background: #e2eaf6; color: #4a7cc9; }
        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            padding: 16px 16px 0 16px;
        }
        .cart-item {
            background: white;
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            border: 1px solid #e8eef6;
            box-shadow: 0 2px 10px rgba(30,58,138,0.04);
        }
        .cart-item-left {
            flex: 1;
            min-width: 0;
        }
        .cart-item-name {
            font-size: 0.875rem;
            font-weight: 700;
            color: #1e2d45;
            margin-bottom: 5px;
            line-height: 1.35;
        }
        .cart-item-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #4a7cc9;
            background: #eef3ff;
            padding: 3px 9px;
            border-radius: 20px;
            margin-bottom: 6px;
        }
        .cart-item-link {
            font-size: 0.7rem;
            color: #a0b0c8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 185px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .cart-item-link i { font-size: 0.65rem; flex-shrink: 0; }
        .cart-item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        .cart-item-price {
            font-weight: 800;
            font-size: 0.95rem;
            color: #2c4a8a;
        }
        .remove-item {
            background: #fef0f0;
            border: none;
            font-size: 0.78rem;
            color: #d97878;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.18s;
        }
        .remove-item:hover { background: #fde0e0; color: #c05050; }
        .cart-total {
            background: white;
            border-radius: 18px;
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            margin: 10px 16px 0 16px;
            border: 1px solid #e8eef6;
            box-shadow: 0 2px 10px rgba(30,58,138,0.04);
        }
        .cart-total span:first-child { color: #8a9ab8; font-size: 0.85rem; font-weight: 600; }
        .cart-total span:last-child { color: #2c4a8a; font-size: 1.05rem; font-weight: 800; }
        .wa-order {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            width: calc(100% - 32px);
            margin: 14px 16px 0 16px;
            padding: 15px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(34,197,94,0.25);
            transition: 0.18s;
        }
        .wa-order:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(34,197,94,0.32); }

        @media (max-width: 450px) {
            .products-grid { gap: 10px; margin: 0 10px; }
            .product-name { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">dixzpays-vip</div>
    <div class="notif-icon" id="notifBtn">
        <i class="fa-regular fa-bell"></i>
    </div>
</div>

<!-- PWA Install Banner -->
<div class="pwa-install-banner" id="pwaInstallBanner">
    <img src="https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png" alt="Icon">
    <div class="pwa-install-info">
        <strong>Install JASA SOSMED</strong>
        <span>Tambahkan ke layar utama sebagai app</span>
    </div>
    <button class="pwa-install-btn" id="pwaInstallBtn">Install</button>
    <span class="pwa-install-close" id="pwaInstallClose"><i class="fa-solid fa-xmark"></i></span>
</div>

<div class="poster-area">
    <img src="https://i.ibb.co.com/hxV2LbK1/IMG-20260515-144100-213.png" alt="Poster TikTok" id="posterImg">
</div>

<div class="filter-scroll">
    <div class="filter-row" id="filterRow">
        <div class="filter-chip active" data-filter="all"><i class="fa-regular fa-compass"></i> Semua</div>
        <div class="filter-chip" data-filter="followers"><i class="fa-solid fa-user-group"></i> Followers</div>
        <div class="filter-chip" data-filter="likes"><i class="fa-regular fa-heart"></i> Like</div>
        <div class="filter-chip" data-filter="views"><i class="fa-regular fa-eye"></i> Views</div>
    </div>
</div>

<div class="products-grid" id="productsGrid"></div>

<div class="cart-float" id="cartFloat">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="cart-badge" id="cartCount">0</span>
</div>

<!-- MODAL KONFIRMASI DENGAN INPUT LINK -->
<div id="confirmModal" class="modal-confirm">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">100 Followers Indonesia</h3>
        </div>
        <!-- Quantity chips -->
        <div class="qty-chips-row" id="qtyChipsRow"></div>
        <!-- Input jumlah custom -->
        <div class="qty-input-section">
            <label>Masukkan jumlah (min. 100)</label>
            <input type="number" id="qtyInput" placeholder="Contoh: 200" min="100" autocomplete="off">
        </div>
        <!-- Total harga real-time -->
        <div class="total-price-bar">
            <span class="total-price-label">Total Harga</span>
            <span class="total-price-value" id="totalPriceDisplay">Rp 0</span>
        </div>
        <!-- Input link -->
        <div class="input-link-section" id="inputLinkSection">
            <label id="inputLabel">Masukkan link TikTok kamu</label>
            <input type="text" id="linkInput" placeholder="https://www.tiktok.com/@username" autocomplete="off">
            <div class="error-message" id="errorMsg">Link dan jumlah wajib diisi!</div>
        </div>
        <div class="datetime-info" id="modalDatetime"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelModalBtn">Batal</button>
            <button class="btn-confirm" id="confirmModalBtn"><i class="fa-solid fa-cart-shopping" style="margin-right:6px;"></i>Keranjang</button>
        </div>
    </div>
</div>

<div id="cartPage" class="cart-fullpage">
    <div class="cart-header">
        <h2><i class="fa-solid fa-cart-shopping"></i> Keranjang</h2>
        <div class="close-cart-icon" id="closeCartBtn"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div id="cartItemsContainer" class="cart-items-list"></div>
    <div id="cartTotalContainer" class="cart-total">
        <span>Total</span>
        <span id="totalPriceSpan">Rp 0</span>
    </div>
    <button id="waOrderBtn" class="wa-order"><i class="fab fa-whatsapp"></i> Pesan Sekarang</button>
</div>

<script>
    // =============================================
    // PWA SETUP - Manifest + Service Worker (1 file)
    // =============================================

    // 1. Inject Web App Manifest via Blob URL
    (function injectManifest() {
        const iconUrl = "https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png";
        const manifest = {
            name: "JASA SOSMED",
            short_name: "JASA SOSMED",
            description: "Jasa Sosmed TikTok - Followers, Likes, Views",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#eef2f7",
            theme_color: "#1e3a8a",
            orientation: "portrait",
            icons: [
                { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
            ],
            categories: ["shopping", "social"],
            lang: "id"
        };

        const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = manifestURL;
        document.head.appendChild(link);
    })();

    // 2. Register Service Worker via Blob URL
    (function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;

        const swCode = `
            const CACHE_NAME = 'jasa-sosmed-v1';
            const urlsToCache = [
                self.location.href
            ];

            self.addEventListener('install', function(event) {
                event.waitUntil(
                    caches.open(CACHE_NAME).then(function(cache) {
                        return cache.addAll(urlsToCache).catch(function() {
                            return Promise.resolve();
                        });
                    })
                );
                self.skipWaiting();
            });

            self.addEventListener('activate', function(event) {
                event.waitUntil(
                    caches.keys().then(function(cacheNames) {
                        return Promise.all(
                            cacheNames.filter(function(name) {
                                return name !== CACHE_NAME;
                            }).map(function(name) {
                                return caches.delete(name);
                            })
                        );
                    })
                );
                return self.clients.claim();
            });

            self.addEventListener('fetch', function(event) {
                event.respondWith(
                    fetch(event.request).catch(function() {
                        return caches.match(event.request);
                    })
                );
            });
        `;

        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swURL = URL.createObjectURL(swBlob);

        navigator.serviceWorker.register(swURL, { scope: '/' })
            .then(function(reg) {
                console.log('[PWA] Service Worker registered');
            })
            .catch(function(err) {
                // Blob SW scope terbatas, fallback normal
                console.log('[PWA] SW via blob, scope limited:', err.message);
            });
    })();

    // 3. Handle Install Prompt (beforeinstallprompt)
    let deferredPrompt = null;
    const installBanner = document.getElementById('pwaInstallBanner');
    const installBtn = document.getElementById('pwaInstallBtn');
    const installClose = document.getElementById('pwaInstallClose');

    window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        // Tampilkan banner setelah 1.5 detik agar tidak ganggu UX
        setTimeout(function() {
            installBanner.classList.add('visible');
        }, 1500);
    });

    installBtn.addEventListener('click', async function() {
        if (!deferredPrompt) return;
        installBanner.classList.remove('visible');
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('[PWA] Install outcome:', outcome);
        deferredPrompt = null;
    });

    installClose.addEventListener('click', function() {
        installBanner.classList.remove('visible');
    });

    // Sembunyikan banner jika sudah terinstall
    window.addEventListener('appinstalled', function() {
        installBanner.classList.remove('visible');
        deferredPrompt = null;
        showNotification('App berhasil diinstall!');
    });

    // =============================================
    // DATA & LOGIC WEBSITE
    // =============================================

    // Data produk
    const products = [
        { id: "fol_luar", type: "followers", amount: 100, price: 7000, serviceText: "TIKTOK LUAR NEGERI", rating: "4.9", shortType: "Followers" },
        { id: "fol_indonesia", type: "followers", amount: 100, price: 12000, serviceText: "TIKTOK INDONESIA", rating: "4.8", shortType: "Followers" },
        { id: "like_100", type: "likes", amount: 100, price: 1000, serviceText: "LIKES TIKTOK", rating: "4.7", shortType: "Likes" },
        { id: "view_1000", type: "views", amount: 1000, price: 500, serviceText: "VIEWS TIKTOK", rating: "4.6", shortType: "Views" }
    ];

    let cart = [];
    let currentFilter = "all";
    let selectedProduct = null;

    // DOM elements
    const productsGrid = document.getElementById("productsGrid");
    const filterChips = document.querySelectorAll(".filter-chip");
    const cartCountSpan = document.getElementById("cartCount");
    const cartFloatBtn = document.getElementById("cartFloat");
    const cartPageDiv = document.getElementById("cartPage");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const cartItemsContainer = document.getElementById("cartItemsContainer");
    const totalPriceSpan = document.getElementById("totalPriceSpan");
    const waOrderBtn = document.getElementById("waOrderBtn");
    const notifBtn = document.getElementById("notifBtn");

    // Modal elements
    const modal = document.getElementById("confirmModal");
    const modalTitle = document.getElementById("modalTitle");
    const qtyChipsRow = document.getElementById("qtyChipsRow");
    const qtyInput = document.getElementById("qtyInput");
    const totalPriceDisplay = document.getElementById("totalPriceDisplay");
    const inputLinkSection = document.getElementById("inputLinkSection");
    const inputLabel = document.getElementById("inputLabel");
    const linkInput = document.getElementById("linkInput");
    const errorMsg = document.getElementById("errorMsg");
    const modalDatetime = document.getElementById("modalDatetime");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const confirmModalBtn = document.getElementById("confirmModalBtn");

    // Qty presets per tipe produk
    const qtyPresets = {
        followers: [100, 200, 500, 1000],
        likes: [100, 200, 500, 1000],
        views: [1000, 2000, 5000, 10000]
    };

    // Notifikasi
    function showNotification(message) {
        const existing = document.querySelector('.notification-toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'notification-toast';
        toast.innerHTML = `<i class="fa-regular fa-bell"></i><div class="notif-text">${message}<br><small>${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</small></div>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
    }
    function getUnitPrice(product) {
        return product.price / product.amount;
    }

    function updateTotalPrice(product) {
        const qty = parseInt(qtyInput.value) || 0;
        const unitPrice = getUnitPrice(product);
        const total = Math.round(qty * unitPrice);
        totalPriceDisplay.innerText = qty > 0 ? `Rp ${total.toLocaleString('id-ID')}` : 'Rp 0';
    }

    function setQtyChip(value, product) {
        selectedQty = value;
        qtyInput.value = value;
        document.querySelectorAll('.qty-chip').forEach(c => {
            c.classList.toggle('selected', parseInt(c.dataset.qty) === value);
        });
        updateTotalPrice(product);
    }

    function showModal(product) {
        const typeName = product.type === "followers" ? "Followers" : (product.type === "likes" ? "Likes" : "Views");
        const country = product.serviceText === "TIKTOK LUAR NEGERI" ? " Luar Negeri" : (product.serviceText === "TIKTOK INDONESIA" ? " Indonesia" : "");
        modalTitle.innerText = `${typeName}${country}`;

        // Build qty chips
        const presets = qtyPresets[product.type] || [100, 200, 500, 1000];
        qtyChipsRow.innerHTML = "";
        presets.forEach(val => {
            const chip = document.createElement('div');
            chip.className = 'qty-chip' + (val === presets[0] ? ' selected' : '');
            chip.dataset.qty = val;
            chip.innerText = val.toLocaleString('id-ID');
            chip.addEventListener('click', () => setQtyChip(val, product));
            qtyChipsRow.appendChild(chip);
        });

        // Reset qty input
        selectedQty = presets[0];
        qtyInput.value = presets[0];
        updateTotalPrice(product);

        // Input qty listener
        qtyInput.oninput = () => {
            const val = parseInt(qtyInput.value) || 0;
            selectedQty = val;
            document.querySelectorAll('.qty-chip').forEach(c => {
                c.classList.toggle('selected', parseInt(c.dataset.qty) === val);
            });
            updateTotalPrice(product);
        };

        // Label & placeholder link
        if (product.type === "followers") {
            inputLabel.innerText = "Link profil TikTok kamu";
            linkInput.placeholder = "tiktok.com/@username";
        } else {
            inputLabel.innerText = "Link video TikTok";
            linkInput.placeholder = "https://vt.tiktok.com/123456789/";
        }

        linkInput.value = "";
        errorMsg.style.display = "none";
        const now = new Date();
        modalDatetime.innerText = `${now.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })} | ${now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' })}`;
        modal.style.display = "flex";
        selectedProduct = product;
    }

    function validateAndAdd() {
        const linkValue = linkInput.value.trim();
        const qty = parseInt(qtyInput.value) || 0;
        if (linkValue === "" || qty < 100) {
            errorMsg.style.display = "block";
            errorMsg.innerText = linkValue === "" ? "Link wajib diisi!" : (qty < 100 ? "Jumlah minimal 100!" : "Link dan jumlah wajib diisi!");
            return;
        }
        errorMsg.style.display = "none";
        const typeName = selectedProduct.type === "followers" ? "Followers" : (selectedProduct.type === "likes" ? "Likes" : "Views");
        const unitPrice = getUnitPrice(selectedProduct);
        const totalPrice = Math.round(qty * unitPrice);
        cart.push({
            id: selectedProduct.id + "_" + Date.now(),
            name: `${qty.toLocaleString('id-ID')} ${typeName} (${selectedProduct.serviceText})`,
            price: totalPrice,
            qty: qty,
            type: selectedProduct.type,
            link: linkValue
        });
        updateCartBadge();
        showNotification(`Ditambahkan ke keranjang`);
        modal.style.display = "none";
        selectedProduct = null;
        linkInput.value = "";
    }

    function updateCartBadge() { cartCountSpan.innerText = cart.length; }

    function getIconHtml(type) {
        if (type === "followers") return '<i class="fa-solid fa-user-plus"></i>';
        if (type === "likes") return '<i class="fa-regular fa-heart"></i>';
        return '<i class="fa-regular fa-eye"></i>';
    }

    function renderProducts() {
        let filtered = products;
        if (currentFilter !== "all") {
            filtered = products.filter(p => p.type === currentFilter);
        }
        productsGrid.innerHTML = "";
        filtered.forEach(prod => {
            const card = document.createElement("div");
            card.className = "product-card";
            const unitLabel = prod.type === "followers" ? "fol" : (prod.type === "likes" ? "like" : "view");
            const amountFormatted = prod.amount.toLocaleString('id-ID');
            const priceFormatted = prod.price.toLocaleString('id-ID');
            card.innerHTML = `
                <div class="product-icon-large">${getIconHtml(prod.type)}</div>
                <div class="product-name">${amountFormatted} ${prod.shortType}</div>
                <div class="product-service-type">${prod.serviceText}</div>
                <div class="price-line">
                    <span class="price-nominal">Rp ${priceFormatted}</span>
                    <span class="price-per-unit">/${amountFormatted} ${unitLabel}</span>
                </div>
                <div class="divider-line"></div>
                <div class="rating-row">
                    <span class="rating-label">Rating</span>
                    <i class="fa-solid fa-star star-icon"></i>
                    <span class="rating-number">${prod.rating}</span>
                </div>
            `;
            card.addEventListener("click", () => showModal(prod));
            productsGrid.appendChild(card);
        });
    }

    function renderCartPage() {
        if (cart.length === 0) {
            cartItemsContainer.innerHTML = `
                <div style="text-align:center; padding:56px 20px;">
                    <div style="width:64px;height:64px;background:#eef3ff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;"><i class="fa-solid fa-cart-shopping" style="font-size:1.6rem;color:#8aacdc;"></i></div>
                    <p style="color:#a0b0c8;font-size:0.88rem;font-weight:500;">Keranjang kamu masih kosong</p>
                </div>`;
            totalPriceSpan.innerText = "Rp 0";
            return;
        }
        let total = 0;
        let html = "";
        cart.forEach((item, idx) => {
            total += item.price;
            const shortLink = item.link.length > 30 ? item.link.substring(0, 30) + '...' : item.link;
            const typeIcon = item.type === "followers" ? "fa-user-plus" : (item.type === "likes" ? "fa-heart" : "fa-eye");
            const typeName = item.type === "followers" ? "Followers" : (item.type === "likes" ? "Likes" : "Views");
            html += `
                <div class="cart-item">
                    <div class="cart-item-left">
                        <div class="cart-item-type-badge"><i class="fa-solid ${typeIcon}"></i> ${typeName}</div>
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-link"><i class="fa-solid fa-link"></i><span>${shortLink}</span></div>
                    </div>
                    <div class="cart-item-right">
                        <span class="cart-item-price">Rp ${item.price.toLocaleString('id-ID')}</span>
                        <button class="remove-item" data-index="${idx}"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>
            `;
        });
        cartItemsContainer.innerHTML = html;
        totalPriceSpan.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        document.querySelectorAll(".remove-item").forEach(btn => {
            btn.addEventListener("click", () => {
                const idx = parseInt(btn.getAttribute("data-index"));
                if (!isNaN(idx) && cart[idx]) {
                    cart.splice(idx, 1);
                    renderCartPage();
                    updateCartBadge();
                }
            });
        });
    }

    function openCart() { renderCartPage(); cartPageDiv.style.display = "block"; document.body.style.overflow = "hidden"; }
    function closeCart() { cartPageDiv.style.display = "none"; document.body.style.overflow = ""; }
    function sendWhatsappOrder() {
        if (cart.length === 0) { alert("Keranjang kosong"); return; }
        let orderList = "", totalAll = 0;
        cart.forEach((item, i) => {
            orderList += `${i+1}. ${item.name}\n   Link: ${item.link}\n   Harga: Rp ${item.price.toLocaleString('id-ID')}\n`;
            totalAll += item.price;
        });
        const finalMsg = `Halo Dixzpays-VIP%0A%0ASaya ingin memesan:%0A${encodeURIComponent(orderList)}%0A%0ATotal: Rp ${totalAll.toLocaleString('id-ID')}%0A%0ATolong diproses, terima kasih.`;
        window.open(`https://wa.me/6282129051447?text=${finalMsg}`, "_blank");
    }
    function setFilter(value) {
        currentFilter = value;
        filterChips.forEach(chip => {
            if (chip.getAttribute("data-filter") === value) chip.classList.add("active");
            else chip.classList.remove("active");
        });
        renderProducts();
    }

    // Event listeners
    filterChips.forEach(chip => chip.addEventListener("click", () => setFilter(chip.getAttribute("data-filter"))));
    cartFloatBtn.addEventListener("click", openCart);
    closeCartBtn.addEventListener("click", closeCart);
    waOrderBtn.addEventListener("click", sendWhatsappOrder);
    notifBtn.addEventListener("click", () => showNotification("Terimakasih sudah datang"));
    cancelModalBtn.addEventListener("click", () => { modal.style.display = "none"; selectedProduct = null; linkInput.value = ""; errorMsg.style.display = "none"; });
    confirmModalBtn.addEventListener("click", validateAndAdd);
    modal.addEventListener("click", (e) => { if (e.target === modal) { modal.style.display = "none"; selectedProduct = null; linkInput.value = ""; } });
    cartPageDiv.addEventListener("click", (e) => { if (e.target === cartPageDiv) closeCart(); });

    renderProducts();
    updateCartBadge();
</script>
</body>
</html>
