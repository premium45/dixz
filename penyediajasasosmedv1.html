<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JASA SOSMED</title>
    <meta name="application-name" content="JASA SOSMED">
    <meta name="apple-mobile-web-app-title" content="JASA SOSMED">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="description" content="Jasa Sosmed TikTok & Instagram - Followers, Likes, Views">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        *:focus, *:focus-visible { outline:none; }

        body {
            font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background:#eef2f7; color:#2c3a52;
            padding-bottom:96px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
        }

        /* NAVBAR */
        .navbar {
            background:rgba(255,255,255,0.95); backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px); padding:16px 20px;
            display:flex; justify-content:space-between; align-items:center;
            box-shadow:0 1px 0 #e8edf5; position:sticky; top:0; z-index:100;
        }
        .logo {
            font-size:1.6rem; font-weight:800;
            background:linear-gradient(135deg,#1e3a8a,#7c3aed);
            background-clip:text; -webkit-background-clip:text; color:transparent;
        }
        .notif-icon {
            background:#f0f3f9; width:44px; height:44px;
            display:flex; align-items:center; justify-content:center;
            border-radius:30px; cursor:pointer; transition:0.2s;
            font-size:1.3rem; color:#1e293b; position:relative;
        }
        /* RED DOT notifikasi */
        .notif-dot {
            position:absolute; top:8px; right:8px;
            width:9px; height:9px; background:#ef4444;
            border-radius:50%; border:2px solid white; display:none;
        }
        .notif-dot.on { display:block; }

        /* TOAST */
        .notification-toast {
            position:fixed; top:76px; right:16px;
            background:rgba(255,255,255,0.97); backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px); border-radius:16px;
            padding:12px 16px; box-shadow:0 8px 28px rgba(30,58,138,0.13);
            display:flex; align-items:center; gap:10px; z-index:500;
            transform:translateX(130%); transition:transform 0.35s cubic-bezier(0.2,0.9,0.4,1.1);
            border-left:3px solid #6c9cd8; max-width:268px;
        }
        .notification-toast i { color:#6c9cd8; font-size:1rem; flex-shrink:0; }
        .notification-toast .nt { font-size:0.82rem; font-weight:600; color:#2c3a52; line-height:1.4; }
        .notification-toast .nt small { font-weight:500; color:#a0b0c8; font-size:0.72rem; display:block; }
        .notification-toast.show { transform:translateX(0); }

        /* PWA BANNER */
        .pwa-install-banner {
            display:none; margin:12px 16px;
            background:linear-gradient(135deg,#1e3a8a,#3b6bbf);
            border-radius:18px; padding:14px 16px; align-items:center; gap:12px;
            box-shadow:0 6px 20px rgba(30,58,138,0.2);
            animation:slideDown 0.4s cubic-bezier(0.34,1.3,0.64,1);
        }
        .pwa-install-banner.visible { display:flex; }
        .pwa-install-banner img { width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; }
        .pwa-install-info { flex:1; }
        .pwa-install-info strong { display:block; color:white; font-size:0.88rem; font-weight:700; }
        .pwa-install-info span { color:rgba(255,255,255,0.75); font-size:0.75rem; }
        .pwa-install-btn {
            background:white; color:#1e3a8a; border:none;
            padding:8px 16px; border-radius:30px; font-weight:700; font-size:0.8rem;
            cursor:pointer; white-space:nowrap; flex-shrink:0; transition:0.18s;
        }
        .pwa-install-btn:hover { background:#eef3ff; }
        .pwa-install-close { color:rgba(255,255,255,0.6); font-size:1.1rem; cursor:pointer; flex-shrink:0; padding:4px; }

        @keyframes slideDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }

        /* POSTER */
        .poster-area { margin:20px 16px 24px; border-radius:12px; overflow:hidden; line-height:0; }
        .poster-area img { width:100%; height:auto; display:block; object-fit:contain; }

        /* FILTER */
        .filter-scroll { margin:0 16px 24px; overflow-x:auto; white-space:nowrap; scrollbar-width:none; -ms-overflow-style:none; }
        .filter-scroll::-webkit-scrollbar { display:none; }
        .filter-row { display:flex; gap:10px; }
        .filter-chip {
            display:inline-flex; align-items:center; gap:7px;
            background:white; border:1px solid #dde6f0;
            padding:9px 16px; border-radius:60px;
            font-weight:700; font-size:0.82rem; cursor:pointer;
            color:#5a7299; transition:0.18s; white-space:nowrap;
        }
        .filter-chip.active { background:#2c4a8a; border-color:#2c4a8a; color:white; }
        .filter-chip:hover:not(.active) { border-color:#b0c4df; background:#f5f8ff; }

        /* icon filter */
        .fi { width:17px; height:17px; display:inline-flex; align-items:center; justify-content:center; }
        .fi-ig {
            background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
            border-radius:4px;
        }
        .fi-ig i { color:white; font-size:9px; }
        .filter-chip.active .fi-ig { background:rgba(255,255,255,0.25); }

        /* PRODUCTS */
        .products-grid { margin:0 12px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .product-card {
            background:#fff; border-radius:22px; padding:14px 12px;
            cursor:pointer; transition:0.22s ease;
            border:1px solid #e8eef6; box-shadow:0 2px 12px rgba(30,58,138,0.04);
        }
        .product-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(30,58,138,0.08); border-color:#c8d8ef; }
        .product-name { font-weight:700; font-size:0.95rem; color:#1e2d45; margin-bottom:4px; }
        .product-service-type { font-weight:600; font-size:0.62rem; text-transform:uppercase; color:#7a8fa8; margin-bottom:10px; letter-spacing:0.03em; }
        .product-icon-large {
            width:44px; height:44px; display:flex; align-items:center; justify-content:center;
            border-radius:16px; margin-bottom:12px;
        }
        .icon-tiktok { background:linear-gradient(135deg,#010101,#1a1a1a); }
        .icon-instagram { background:linear-gradient(135deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); }
        .icon-instagram i { color:white; font-size:1.3rem; }

        .price-line { display:flex; align-items:baseline; gap:4px; margin:6px 0; flex-wrap:wrap; }
        .price-nominal { font-weight:800; font-size:1.05rem; color:#2c4a8a; }
        .price-per-unit { font-size:0.68rem; font-weight:600; color:#7a8fa8; background:#f0f4fb; padding:2px 8px; border-radius:40px; }
        .divider-line { margin:10px 0 8px; height:1px; background:#f0f4f9; }
        .rating-row { display:flex; align-items:center; gap:6px; }
        .rating-label { font-weight:600; font-size:0.62rem; color:#8a9ab8; }
        .star-icon { color:#f0b429; font-size:0.72rem; }
        .rating-number { font-weight:700; font-size:0.72rem; background:#f0f4fb; padding:2px 8px; border-radius:40px; color:#5a7299; }

        /* FLOAT CART */
        .cart-float {
            position:fixed; bottom:24px; right:16px;
            background:linear-gradient(135deg,#2c4a8a,#3b6bbf);
            width:56px; height:56px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; z-index:200; box-shadow:0 8px 24px rgba(44,74,138,0.3); transition:0.2s;
        }
        .cart-float:hover { transform:translateY(-2px); }
        .cart-float i { font-size:1.4rem; color:white; }
        .cart-badge {
            position:absolute; top:-6px; right:-4px;
            background:#ef4444; color:white; font-weight:800; font-size:0.7rem;
            padding:4px 8px; border-radius:30px; min-width:22px; text-align:center;
        }

        /* MODAL */
        .modal-confirm {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(15,23,42,0.35); backdrop-filter:blur(12px) saturate(1.2);
            -webkit-backdrop-filter:blur(12px) saturate(1.2);
            align-items:center; justify-content:center; z-index:300;
        }
        .modal-card {
            background:rgba(255,255,255,0.97); width:90%; max-width:380px;
            border-radius:28px; overflow:hidden;
            animation:fadeIn 0.25s cubic-bezier(0.34,1.3,0.64,1);
            box-shadow:0 24px 60px rgba(15,23,42,0.12),0 8px 20px rgba(15,23,42,0.06);
        }
        .modal-header { padding:22px 20px 0; }
        .modal-header h3 { font-size:1.15rem; font-weight:800; text-align:center; color:#0f172a; }
        .qty-chips-row { display:flex; gap:8px; flex-wrap:wrap; margin:14px 20px 0; }
        .qty-chip {
            flex:1; min-width:56px; text-align:center; padding:9px 10px;
            border-radius:14px; border:1.5px solid #e2e8f0; background:#f8fafc;
            font-weight:700; font-size:0.85rem; color:#334155; cursor:pointer; transition:0.18s;
        }
        .qty-chip.selected { background:#1e3a8a; border-color:#1e3a8a; color:white; }
        .qty-chip:hover:not(.selected) { border-color:#94aad4; background:#eef3ff; }
        .qty-input-section { margin:12px 20px 0; }
        .qty-input-section label { font-size:0.72rem; font-weight:600; color:#64748b; display:block; margin-bottom:5px; }
        .qty-input-section input {
            width:100%; padding:11px 14px; border:1.5px solid #e2e8f0;
            border-radius:14px; font-size:0.9rem; font-weight:600; outline:none;
            transition:0.18s; color:#1e293b; background:#f8fafc;
        }
        .qty-input-section input:focus { border-color:#1e3a8a; background:white; box-shadow:0 0 0 3px rgba(30,58,138,0.08); }
        .total-price-bar {
            margin:12px 20px;
            background:linear-gradient(135deg,#eef3ff 0%,#f0f7ff 100%);
            border-radius:16px; padding:12px 16px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .total-price-label { font-size:0.8rem; font-weight:600; color:#64748b; }
        .total-price-value { font-size:1.1rem; font-weight:800; color:#1e3a8a; }
        .input-link-section { margin:0 20px 12px; }
        .input-link-section label { font-size:0.72rem; font-weight:600; color:#64748b; display:block; margin-bottom:5px; }
        .input-link-section input {
            width:100%; padding:11px 14px; border:1.5px solid #e2e8f0;
            border-radius:14px; font-size:0.84rem; outline:none;
            transition:0.18s; background:#f8fafc; color:#1e293b;
            font-family:'Inter',sans-serif;
        }
        .input-link-section input:focus { border-color:#1e3a8a; background:white; box-shadow:0 0 0 3px rgba(30,58,138,0.08); }
        .error-message { font-size:0.7rem; color:#ef4444; margin-top:6px; display:none; }
        .datetime-info { font-size:0.68rem; color:#94a3b8; text-align:center; margin:6px 20px 10px; }
        .modal-actions { display:flex; gap:10px; padding:0 20px 22px; }
        .btn-confirm,.btn-cancel { flex:1; padding:13px; border-radius:60px; font-weight:700; font-size:0.9rem; border:none; cursor:pointer; transition:0.18s; }
        .btn-confirm { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:white; box-shadow:0 6px 18px rgba(30,58,138,0.25); }
        .btn-confirm:hover { transform:translateY(-1px); }
        .btn-cancel { background:#f1f5f9; color:#64748b; }
        .btn-cancel:hover { background:#e8eef6; }
        @keyframes fadeIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }

        /* HALAMAN KERANJANG */
        .cart-fullpage {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:#f0f4fb; z-index:400; overflow-y:auto; padding:0 0 120px;
        }
        .cart-header {
            display:flex; justify-content:space-between; align-items:center;
            padding:20px 18px 16px; background:rgba(255,255,255,0.95);
            backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
            position:sticky; top:0; z-index:10; border-bottom:1px solid #e8edf5;
        }
        .cart-header h2 { font-size:1.2rem; font-weight:800; color:#1e2d45; display:flex; align-items:center; gap:9px; }
        .cart-header h2 i { font-size:1.05rem; color:#4a7cc9; }
        .close-cart-icon {
            background:#f0f4fb; width:38px; height:38px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; font-size:1rem; color:#7a8fa8; transition:0.18s;
        }
        .close-cart-icon:hover { background:#e2eaf6; color:#4a7cc9; }

        .cart-items-list { display:flex; flex-direction:column; gap:12px; padding:16px 14px 0; }

        /* CART ITEM — rapih */
        .cart-item {
            background:white; border-radius:20px; overflow:hidden;
            border:1px solid #e4eaf5; box-shadow:0 3px 14px rgba(30,58,138,0.05);
        }
        .cart-item-top { display:flex; align-items:center; gap:12px; padding:14px 14px 10px; }
        .ci-platform-icon {
            width:44px; height:44px; border-radius:13px;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .ci-platform-icon.bg-tiktok { background:linear-gradient(135deg,#010101,#1e1e1e); }
        .ci-platform-icon.bg-instagram { background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
        .ci-platform-icon i { color:white; font-size:1.15rem; }
        .ci-info { flex:1; min-width:0; }
        .ci-name { font-size:0.88rem; font-weight:700; color:#1e2d45; line-height:1.3; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ci-service { font-size:0.68rem; font-weight:600; color:#8a9ab8; text-transform:uppercase; letter-spacing:0.04em; }
        .ci-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
        .ci-price { font-weight:800; font-size:0.98rem; color:#2c4a8a; white-space:nowrap; }
        .remove-item {
            background:#fef0f0; border:none; font-size:0.72rem; color:#d97878;
            cursor:pointer; width:28px; height:28px; border-radius:9px;
            display:flex; align-items:center; justify-content:center; transition:0.18s;
        }
        .remove-item:hover { background:#fde0e0; color:#c05050; }
        .cart-item-bottom {
            background:#f7faff; border-top:1px solid #eef3fb;
            padding:9px 14px; display:flex; align-items:center; gap:7px;
        }
        .cart-item-bottom .ci-link-icon { font-size:0.68rem; color:#94aad4; flex-shrink:0; }
        .cart-item-bottom .ci-link-text { font-size:0.72rem; color:#7a8fa8; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
        .ci-qty-pill { flex-shrink:0; background:#eef3ff; color:#4a7cc9; font-size:0.68rem; font-weight:700; padding:3px 9px; border-radius:20px; }

        /* RINGKASAN CART */
        .cart-summary {
            margin:14px 14px 0; background:white; border-radius:20px; overflow:hidden;
            border:1px solid #e4eaf5; box-shadow:0 3px 14px rgba(30,58,138,0.05);
        }
        .cs-row { display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid #f0f4fb; }
        .cs-row:last-child { border-bottom:none; }
        .cs-label { font-size:0.82rem; font-weight:600; color:#8a9ab8; }
        .cs-value { font-size:0.9rem; font-weight:700; color:#4a6a8a; }
        .cs-total-label { font-size:0.9rem; font-weight:700; color:#1e2d45; }
        .cs-total-value { font-size:1.22rem; font-weight:900; color:#1e3a8a; }

        .wa-order {
            background:linear-gradient(135deg,#22c55e,#16a34a);
            width:calc(100% - 28px); margin:14px 14px 0;
            padding:16px; border:none; border-radius:20px;
            font-weight:800; font-size:1rem; color:white;
            display:flex; align-items:center; justify-content:center; gap:10px;
            cursor:pointer; box-shadow:0 6px 20px rgba(34,197,94,0.25); transition:0.18s;
        }
        .wa-order:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(34,197,94,0.32); }

        @media (max-width:450px) {
            .products-grid { gap:10px; margin:0 10px; }
            .product-name { font-size:0.9rem; }
            .cart-items-list { padding:12px 12px 0; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">dixzpays-vip</div>
    <div class="notif-icon" id="notifBtn">
        <i class="fa-regular fa-bell"></i>
        <span class="notif-dot" id="notifDot"></span>
    </div>
</div>

<!-- PWA Install Banner -->
<div class="pwa-install-banner" id="pwaInstallBanner">
    <img src="https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png" alt="Icon">
    <div class="pwa-install-info">
        <strong>Install JASA SOSMED</strong>
        <span>Tambahkan ke layar utama sebagai app</span>
    </div>
    <button class="pwa-install-btn" id="pwaInstallBtn">Install</button>
    <span class="pwa-install-close" id="pwaInstallClose"><i class="fa-solid fa-xmark"></i></span>
</div>

<!-- POSTER BARU -->
<div class="poster-area">
    <img src="https://i.ibb.co.com/5XVZLNTF/AIRetouch-20260516-143642367.png" alt="Poster Jasa Sosmed">
</div>

<!-- FILTER: Semua | TikTok | Instagram -->
<div class="filter-scroll">
    <div class="filter-row">
        <div class="filter-chip active" data-filter="all">
            <span class="fi">
                <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                    <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M3.5 7.5h13M3.5 12.5h13M10 2a12 12 0 010 16M10 2a12 12 0 000 16" stroke="currentColor" stroke-width="1.5"/>
                </svg>
            </span>
            Semua
        </div>
        <div class="filter-chip" data-filter="tiktok">
            <span class="fi">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="15" height="15">
                    <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.32 6.32 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.73a4.85 4.85 0 01-1.01-.04z"/>
                </svg>
            </span>
            TikTok
        </div>
        <div class="filter-chip" data-filter="instagram">
            <span class="fi fi-ig"><i class="fa-brands fa-instagram"></i></span>
            Instagram
        </div>
    </div>
</div>

<div class="products-grid" id="productsGrid"></div>

<div class="cart-float" id="cartFloat">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="cart-badge" id="cartCount">0</span>
</div>

<!-- MODAL -->
<div id="confirmModal" class="modal-confirm">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">Followers TikTok Indonesia</h3>
        </div>
        <div class="qty-chips-row" id="qtyChipsRow"></div>
        <div class="qty-input-section">
            <label>Masukkan jumlah (min. 100)</label>
            <input type="number" id="qtyInput" placeholder="Contoh: 200" min="100" autocomplete="off">
        </div>
        <div class="total-price-bar">
            <span class="total-price-label">Total Harga</span>
            <span class="total-price-value" id="totalPriceDisplay">Rp 0</span>
        </div>
        <div class="input-link-section">
            <label id="inputLabel">Masukkan link TikTok kamu</label>
            <input type="text" id="linkInput" placeholder="https://www.tiktok.com/@username" autocomplete="off">
            <div class="error-message" id="errorMsg">Wajib diisi!</div>
        </div>
        <div class="datetime-info" id="modalDatetime"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelModalBtn">Batal</button>
            <button class="btn-confirm" id="confirmModalBtn"><i class="fa-solid fa-cart-shopping" style="margin-right:6px;"></i>Keranjang</button>
        </div>
    </div>
</div>

<!-- HALAMAN KERANJANG -->
<div id="cartPage" class="cart-fullpage">
    <div class="cart-header">
        <h2><i class="fa-solid fa-cart-shopping"></i> Keranjang</h2>
        <div class="close-cart-icon" id="closeCartBtn"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div id="cartItemsContainer" class="cart-items-list"></div>
    <div id="cartSummary" class="cart-summary" style="display:none;">
        <div class="cs-row">
            <span class="cs-label">Jumlah Item</span>
            <span class="cs-value" id="cartItemCount">0 item</span>
        </div>
        <div class="cs-row">
            <span class="cs-total-label">Total Pembayaran</span>
            <span class="cs-total-value" id="totalPriceSpan">Rp 0</span>
        </div>
    </div>
    <button id="waOrderBtn" class="wa-order" style="display:none;"><i class="fab fa-whatsapp" style="font-size:1.2rem;"></i> Pesan via WhatsApp</button>
</div>

<script>
// ===== PWA =====
(function injectManifest(){
    const iconUrl="https://i.ibb.co.com/RGg8s7MD/AIRetouch-20260516-103357272.png";
    const m={name:"JASA SOSMED",short_name:"JASA SOSMED",description:"Jasa Sosmed TikTok & Instagram",start_url:window.location.href,display:"standalone",background_color:"#eef2f7",theme_color:"#1e3a8a",orientation:"portrait",icons:[{src:iconUrl,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:iconUrl,sizes:"512x512",type:"image/png",purpose:"any maskable"}],categories:["shopping","social"],lang:"id"};
    const b=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
    const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(b);document.head.appendChild(l);
})();

(function registerSW(){
    if(!('serviceWorker' in navigator))return;
    const code=`const CN='jasa-sosmed-v2';self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CN).then(c=>c.addAll([]).catch(()=>Promise.resolve())));});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ns=>Promise.all(ns.filter(n=>n!==CN).map(n=>caches.delete(n)))));return self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([code],{type:'application/javascript'})),{scope:'/'})
        .then(()=>console.log('[PWA] SW ok')).catch(e=>console.log('[PWA]',e.message));
})();

let deferredPrompt=null;
const installBanner=document.getElementById('pwaInstallBanner');
const installBtn=document.getElementById('pwaInstallBtn');
const installClose=document.getElementById('pwaInstallClose');

window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferredPrompt=e;
    setTimeout(()=>installBanner.classList.add('visible'),1500);
});
installBtn.addEventListener('click',async function(){
    if(!deferredPrompt)return;
    installBanner.classList.remove('visible');
    showNotification('APK sedang di instal...');
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
});
installClose.addEventListener('click',()=>installBanner.classList.remove('visible'));
window.addEventListener('appinstalled',()=>{
    installBanner.classList.remove('visible');
    deferredPrompt=null;
    showNotification('APK sedang di instal...');
});

// ===== DATA =====
const products=[
    {id:"tt_fol_luar",   platform:"tiktok",    type:"followers",amount:100, price:7000, serviceText:"TIKTOK LUAR NEGERI",   rating:"4.9",shortType:"Followers"},
    {id:"tt_fol_id",     platform:"tiktok",    type:"followers",amount:100, price:12000,serviceText:"TIKTOK INDONESIA",      rating:"4.8",shortType:"Followers"},
    {id:"tt_like",       platform:"tiktok",    type:"likes",    amount:100, price:1000, serviceText:"LIKES TIKTOK",          rating:"4.7",shortType:"Likes"},
    {id:"tt_view",       platform:"tiktok",    type:"views",    amount:1000,price:500,  serviceText:"VIEWS TIKTOK",          rating:"4.6",shortType:"Views"},
    {id:"ig_fol_luar",   platform:"instagram", type:"followers",amount:100, price:3500, serviceText:"INSTAGRAM LUAR NEGERI", rating:"4.8",shortType:"Followers"},
    {id:"ig_fol_id",     platform:"instagram", type:"followers",amount:100, price:5000, serviceText:"INSTAGRAM INDONESIA",   rating:"4.7",shortType:"Followers"}
];

let cart=[],currentFilter="all",selectedProduct=null;

const productsGrid=document.getElementById("productsGrid");
const cartCountSpan=document.getElementById("cartCount");
const cartFloatBtn=document.getElementById("cartFloat");
const cartPageDiv=document.getElementById("cartPage");
const closeCartBtn=document.getElementById("closeCartBtn");
const cartItemsContainer=document.getElementById("cartItemsContainer");
const cartSummary=document.getElementById("cartSummary");
const totalPriceSpan=document.getElementById("totalPriceSpan");
const cartItemCount=document.getElementById("cartItemCount");
const waOrderBtn=document.getElementById("waOrderBtn");
const notifBtn=document.getElementById("notifBtn");
const notifDot=document.getElementById("notifDot");
const modal=document.getElementById("confirmModal");
const modalTitle=document.getElementById("modalTitle");
const qtyChipsRowEl=document.getElementById("qtyChipsRow");
const qtyInput=document.getElementById("qtyInput");
const totalPriceDisplay=document.getElementById("totalPriceDisplay");
const inputLabel=document.getElementById("inputLabel");
const linkInput=document.getElementById("linkInput");
const errorMsg=document.getElementById("errorMsg");
const modalDatetime=document.getElementById("modalDatetime");
const cancelModalBtn=document.getElementById("cancelModalBtn");
const confirmModalBtn=document.getElementById("confirmModalBtn");

const qtyPresets={followers:[100,200,500,1000],likes:[100,200,500,1000],views:[1000,2000,5000,10000]};

const TT_SVG_WHITE=`<svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" width="22" height="22"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.32 6.32 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.73a4.85 4.85 0 01-1.01-.04z"/></svg>`;

// ===== NOTIFIKASI =====
function showNotification(msg){
    const ex=document.querySelector('.notification-toast');
    if(ex){ex.classList.remove('show');setTimeout(()=>ex.remove(),200);}
    const t=document.createElement('div');
    t.className='notification-toast';
    t.innerHTML=`<i class="fa-regular fa-bell"></i><div class="nt">${msg}<small>${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</small></div>`;
    document.body.appendChild(t);
    setTimeout(()=>t.classList.add('show'),10);
    notifDot.classList.add('on'); // tampilkan red dot
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3500);
}
notifBtn.addEventListener('click',()=>{
    showNotification('Terimakasih sudah datang');
    setTimeout(()=>notifDot.classList.remove('on'),500);
});

// ===== HELPER =====
function getUnitPrice(p){return p.price/p.amount;}
function updateTotalPriceDisplay(p){
    const qty=parseInt(qtyInput.value)||0;
    totalPriceDisplay.innerText=qty>0?`Rp ${Math.round(qty*getUnitPrice(p)).toLocaleString('id-ID')}`:'Rp 0';
}
function setQtyChip(val,p){
    qtyInput.value=val;
    document.querySelectorAll('.qty-chip').forEach(c=>c.classList.toggle('selected',parseInt(c.dataset.qty)===val));
    updateTotalPriceDisplay(p);
}

// ===== RENDER PRODUK =====
function renderProducts(){
    let list=currentFilter==="all"?products:products.filter(p=>p.platform===currentFilter);
    productsGrid.innerHTML="";
    list.forEach(prod=>{
        const card=document.createElement("div");
        card.className="product-card";
        const unitLabel=prod.type==="followers"?"fol":(prod.type==="likes"?"like":"view");
        const amtFmt=prod.amount.toLocaleString('id-ID');
        const priceFmt=prod.price.toLocaleString('id-ID');
        let iconHtml;
        if(prod.platform==="tiktok"){
            iconHtml=`<div class="product-icon-large icon-tiktok">${TT_SVG_WHITE}</div>`;
        } else {
            const ti=prod.type==="followers"?"fa-user-plus":(prod.type==="likes"?"fa-heart":"fa-eye");
            iconHtml=`<div class="product-icon-large icon-instagram"><i class="fa-solid ${ti}"></i></div>`;
        }
        card.innerHTML=`
            ${iconHtml}
            <div class="product-name">${amtFmt} ${prod.shortType}</div>
            <div class="product-service-type">${prod.serviceText}</div>
            <div class="price-line">
                <span class="price-nominal">Rp ${priceFmt}</span>
                <span class="price-per-unit">/${amtFmt} ${unitLabel}</span>
            </div>
            <div class="divider-line"></div>
            <div class="rating-row">
                <span class="rating-label">Rating</span>
                <i class="fa-solid fa-star star-icon"></i>
                <span class="rating-number">${prod.rating}</span>
            </div>`;
        card.addEventListener("click",()=>showModal(prod));
        productsGrid.appendChild(card);
    });
}

// ===== MODAL =====
function showModal(product){
    const typeName=product.type==="followers"?"Followers":(product.type==="likes"?"Likes":"Views");
    const platName=product.platform==="tiktok"?"TikTok":"Instagram";
    const country=product.serviceText.includes("LUAR NEGERI")?" Luar Negeri":(product.serviceText.includes("INDONESIA")?" Indonesia":"");
    modalTitle.innerText=`${typeName} ${platName}${country}`;

    const presets=qtyPresets[product.type]||[100,200,500,1000];
    qtyChipsRowEl.innerHTML="";
    presets.forEach(val=>{
        const c=document.createElement('div');
        c.className='qty-chip'+(val===presets[0]?' selected':'');
        c.dataset.qty=val;c.innerText=val.toLocaleString('id-ID');
        c.addEventListener('click',()=>setQtyChip(val,product));
        qtyChipsRowEl.appendChild(c);
    });
    qtyInput.value=presets[0];
    updateTotalPriceDisplay(product);
    qtyInput.oninput=()=>{
        const v=parseInt(qtyInput.value)||0;
        document.querySelectorAll('.qty-chip').forEach(c=>c.classList.toggle('selected',parseInt(c.dataset.qty)===v));
        updateTotalPriceDisplay(product);
    };

    // Label & placeholder sesuai platform
    if(product.platform==="instagram"){
        if(product.type==="followers"){
            inputLabel.innerText="Masukkan nama pengguna Instagram kamu";
            linkInput.placeholder="nama pengguna";
        } else {
            inputLabel.innerText="Masukkan link postingan Instagram";
            linkInput.placeholder="https://www.instagram.com/p/xxxxx/";
        }
    } else {
        if(product.type==="followers"){
            inputLabel.innerText="Masukkan link profil TikTok kamu";
            linkInput.placeholder="tiktok.com/@username";
        } else {
            inputLabel.innerText="Masukkan link video TikTok";
            linkInput.placeholder="https://vt.tiktok.com/123456789/";
        }
    }

    linkInput.value="";errorMsg.style.display="none";
    const now=new Date();
    modalDatetime.innerText=`${now.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})} | ${now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`;
    modal.style.display="flex";
    selectedProduct=product;
}

function validateAndAdd(){
    const lv=linkInput.value.trim();
    const qty=parseInt(qtyInput.value)||0;
    if(lv===""||qty<100){
        errorMsg.style.display="block";
        errorMsg.innerText=lv===""?"Kolom ini wajib diisi!":"Jumlah minimal 100!";
        return;
    }
    errorMsg.style.display="none";
    const typeName=selectedProduct.type==="followers"?"Followers":(selectedProduct.type==="likes"?"Likes":"Views");
    const platName=selectedProduct.platform==="tiktok"?"TikTok":"Instagram";
    const totalPrice=Math.round(qty*getUnitPrice(selectedProduct));
    cart.push({
        id:selectedProduct.id+"_"+Date.now(),
        name:`${qty.toLocaleString('id-ID')} ${typeName} ${platName}`,
        platform:selectedProduct.platform,
        serviceText:selectedProduct.serviceText,
        type:selectedProduct.type,
        price:totalPrice,qty,link:lv
    });
    updateCartBadge();
    showNotification('Ditambahkan ke keranjang');
    modal.style.display="none";selectedProduct=null;linkInput.value="";
}
function updateCartBadge(){cartCountSpan.innerText=cart.length;}

// ===== RENDER KERANJANG =====
function renderCartPage(){
    if(cart.length===0){
        cartItemsContainer.innerHTML=`
            <div style="text-align:center;padding:64px 20px;">
                <div style="width:68px;height:68px;background:#eef3ff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
                    <i class="fa-solid fa-cart-shopping" style="font-size:1.7rem;color:#8aacdc;"></i>
                </div>
                <p style="color:#a0b0c8;font-size:0.88rem;font-weight:600;">Keranjang kamu masih kosong</p>
                <p style="color:#c0cdd8;font-size:0.76rem;margin-top:4px;">Yuk tambahkan produk dulu</p>
            </div>`;
        cartSummary.style.display="none";waOrderBtn.style.display="none";return;
    }
    let total=0,html="";
    cart.forEach((item,idx)=>{
        total+=item.price;
        const isIG=item.platform==="instagram";
        const bgClass=isIG?"bg-instagram":"bg-tiktok";
        const platIcon=isIG?`<i class="fa-brands fa-instagram" style="font-size:1.15rem;"></i>`:TT_SVG_WHITE;
        const ti=item.type==="followers"?"fa-user-plus":(item.type==="likes"?"fa-heart":"fa-eye");
        const typeName=item.type==="followers"?"Followers":(item.type==="likes"?"Likes":"Views");
        const linkIcon=isIG&&item.type==="followers"?"fa-at":"fa-link";
        html+=`
            <div class="cart-item">
                <div class="cart-item-top">
                    <div class="ci-platform-icon ${bgClass}">${platIcon}</div>
                    <div class="ci-info">
                        <div class="ci-name">${item.name}</div>
                        <div class="ci-service"><i class="fa-solid ${ti}" style="margin-right:3px;font-size:0.62rem;"></i>${item.serviceText}</div>
                    </div>
                    <div class="ci-right">
                        <span class="ci-price">Rp ${item.price.toLocaleString('id-ID')}</span>
                        <button class="remove-item" data-index="${idx}"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>
                <div class="cart-item-bottom">
                    <i class="fa-solid ${linkIcon} ci-link-icon"></i>
                    <span class="ci-link-text">${item.link}</span>
                    <span class="ci-qty-pill">${item.qty.toLocaleString('id-ID')} ${typeName}</span>
                </div>
            </div>`;
    });
    cartItemsContainer.innerHTML=html;
    cartSummary.style.display="block";waOrderBtn.style.display="flex";
    totalPriceSpan.innerText=`Rp ${total.toLocaleString('id-ID')}`;
    cartItemCount.innerText=`${cart.length} item`;
    document.querySelectorAll(".remove-item").forEach(btn=>{
        btn.addEventListener("click",()=>{
            const idx=parseInt(btn.getAttribute("data-index"));
            if(!isNaN(idx)&&cart[idx]){cart.splice(idx,1);renderCartPage();updateCartBadge();}
        });
    });
}

function openCart(){renderCartPage();cartPageDiv.style.display="block";document.body.style.overflow="hidden";}
function closeCart(){cartPageDiv.style.display="none";document.body.style.overflow="";}

function sendWhatsappOrder(){
    if(cart.length===0){alert("Keranjang kosong");return;}
    let orderList="",totalAll=0;
    cart.forEach((item,i)=>{
        const lbl=item.platform==="instagram"&&item.type==="followers"?"Username":"Link";
        orderList+=`${i+1}. ${item.name}\n   ${lbl}: ${item.link}\n   Harga: Rp ${item.price.toLocaleString('id-ID')}\n`;
        totalAll+=item.price;
    });
    const msg=`Halo Dixzpays-VIP%0A%0ASaya ingin memesan:%0A${encodeURIComponent(orderList)}%0A%0ATotal: Rp ${totalAll.toLocaleString('id-ID')}%0A%0ATolong diproses, terima kasih.`;
    window.open(`https://wa.me/6282129051447?text=${msg}`,"_blank");
}

function setFilter(val){
    currentFilter=val;
    document.querySelectorAll(".filter-chip").forEach(c=>c.classList.toggle("active",c.getAttribute("data-filter")===val));
    renderProducts();
}
document.querySelectorAll(".filter-chip").forEach(c=>c.addEventListener("click",()=>setFilter(c.getAttribute("data-filter"))));

cartFloatBtn.addEventListener("click",openCart);
closeCartBtn.addEventListener("click",closeCart);
waOrderBtn.addEventListener("click",sendWhatsappOrder);
cancelModalBtn.addEventListener("click",()=>{modal.style.display="none";selectedProduct=null;linkInput.value="";errorMsg.style.display="none";});
confirmModalBtn.addEventListener("click",validateAndAdd);
modal.addEventListener("click",e=>{if(e.target===modal){modal.style.display="none";selectedProduct=null;linkInput.value="";}});

renderProducts();
updateCartBadge();
</script>
</body>
</html>
